<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beautiful Console</title>
  <link rel="icon" type="image/png" href="./images/beautifull-console-logo.png" />
  <link rel="icon" type="image/x-icon" href="./images/favicon.ico" />
  <script type="module" src="./js/main.js"></script>
  <!-- TAILWIND -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-green-400 font-mono p-[clamp(8px,1vw,10px)] box-border">
  <main class="h-[calc(100vh-2*clamp(8px,1vw,10px))] w-full">
    <!-- CONSOLE -->
    <section class="w-full h-full overflow-hidden rounded-2xl border border-green-500/25 bg-black/80 shadow-2xl shadow-green-950/20 flex flex-col">
      
      <!-- HEADER -->
      <header class="flex items-center justify-between border-b border-green-500/20 px-5 py-3">
        <div>
          <h1 class="text-lg font-semibold tracking-wide text-green-300">Beautiful Console</h1>
        </div>

        <div class="flex items-center gap-2">
          <span class="h-3 w-3 rounded-full bg-red-500/90"></span>
          <span class="h-3 w-3 rounded-full bg-yellow-400/90"></span>
          <span class="h-3 w-3 rounded-full bg-green-500/90"></span>
        </div>
      </header>

      <!-- CONSOLE OUTPUT -->
      <div class="flex-1 overflow-y-auto px-5 py-4 space-y-2" id="console-output"></div>

      <!-- INPUT MANAGING -->
      <form class="border-t border-green-500/20 p-4" id="console-form">
        <div class="flex items-center gap-3 rounded-xl border border-green-500/20 bg-zinc-950 px-4 py-3">
          <span class="text-green-300 select-none">&gt;</span>
          <input
            id="console-input"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="Type a command..."
            class="w-full bg-transparent text-green-100 placeholder:text-green-700 outline-none"
          />
        </div>
      </form>
    </section>
  </main>
</body>
</html>
